<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="p:domain_verify" content="d587ffd5e8166a77f78649f499ff04fa"/>
    <title>Redirecting...</title>
    <!-- Pengalihan otomatis dalam 0 detik -->
    <meta http-equiv="refresh" content="2; url=https://nemospiritgeek.gumroad.com/l/worksheetfortoddlers">
    <style>
        /* Menggunakan font modern bawaan sistem (seperti Apple/iOS) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #09090b; /* Deep black (zinc-950) */
            color: #ffffff;
            position: relative;
            overflow: hidden; /* Mencegah scroll karena efek blur background */
        }

        /* Efek Glow Merah di Belakang Kaca (Glassmorphism Ambient) */
        .glow-1 {
            position: absolute;
            top: 20%;
            left: 30%;
            width: 300px;
            height: 300px;
            background-color: rgba(220, 38, 38, 0.25); /* Merah transparan */
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .glow-2 {
            position: absolute;
            bottom: 20%;
            right: 30%;
            width: 250px;
            height: 250px;
            background-color: rgba(185, 28, 28, 0.2); /* Merah lebih gelap */
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        /* Card Frosted Glass */
        .glass-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem 2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Penyesuaian agar tidak merapat ke tepi */
            box-sizing: border-box; /* Memastikan padding tidak menambah ukuran lebar */
            max-width: 400px;
            width: 85%; /* Sedikit dikurangi dari 90% agar ada ruang kosong di kiri-kanan */
            margin: 0 auto;
            
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tipografi */
        h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0 0 2rem 0;
            color: #a1a1aa; /* Muted gray (zinc-400) */
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Tombol Aksen Merah Minimalis */
        a.btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #dc2626; /* Solid Red */
            color: #ffffff;
            text-decoration: none;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem; /* Agak membulat ala iOS */
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        a.btn:hover {
            background-color: #b91c1c; /* Merah gelap saat di-hover */
            transform: translateY(-2px);
        }
        
        /* Loading Spinner Sederhana */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Elemen Glow Background -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Kontainer Utama -->
    <div class="glass-container">
        <div class="spinner"></div>
        <h2>Redirecting to Product...</h2>
        <p>You will be redirected to your destination link shortly, please wait a few seconds!</p>
        <a href="https://nemospiritgeek.gumroad.com/l/worksheetfortoddlers" class="btn">Go To Product</a>
    </div>
</body>
</html>
